name: Bump release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Determine the next version, create the GitHub release and expose the tag.
  bump-release:
    uses: uug-ai/workflows/.github/workflows/release-bump.yml@ff61364bb99093f43f0c02b2f5091f0e22ba9fb6
    with:
      bump: ${{ github.event.inputs.bump }}
      draft: true
    secrets: inherit

  # Run the original release pipeline for the freshly created tag.
  # A release created with the default GITHUB_TOKEN does not emit the
  # `release: created` event, so we invoke the reusable workflow directly.
  release:
    needs: bump-release
    uses: uug-ai/workflows/.github/workflows/release-create.yml@ff61364bb99093f43f0c02b2f5091f0e22ba9fb6
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      artifact_prefix: cli
      tag: ${{ needs.bump-release.outputs.tag }}
      docker_context: "."
      hardened: true
      hardened_profile: standalone
      hardened_entrypoint: '["/main"]'
      hardened_workdir: "/"
      use_private_module_auth: false
      finalize_release: true
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]
    secrets: inherit
