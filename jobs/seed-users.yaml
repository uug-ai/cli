apiVersion: batch/v1
kind: Job
metadata:
  name: uugai-cli-seed-users
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: seed-users
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        image: uugai/cli:latest
        command: ['/main', '-action', 'seed-users',
            '-mongodb-uri', 'mongodb+srv://<username>:<password>@<host>/<database>?retryWrites=true&w=majority&appName=<appName>',
            '-user-prefix', 'testuser',
            '-target', '500',
          ]

      restartPolicy: Never
      volumes:
      - name: hub-import
        emptyDir: {}